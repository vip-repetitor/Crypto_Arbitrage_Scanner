    <!-- ===== JSON-LD: структурированные данные (FAQPage + FinancialProduct) ===== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "FinancialProduct",
          "@id": "https://bondinvest.ru/#product",
          "name": "BONDINVEST — индекс участия",
          "description": "Сберегательный продукт на реальных ОФЗ с геймифицированным индексом участия: базовые 4% годовых плюс бонусы за лояльность (удержание), объём (средний депозит) и активность (пополнения).",
          "currency": "RUB",
          "url": "https://bondinvest.ru/",
          "annualPercentage": { "@type": "QuantitativeValue", "minValue": 4, "maxValue": 10, "unitText": "%" },
          "feesAndCommission": { "@type": "QuantitativeValue", "minValue": 0, "unitText": "₽" }
        },
        {
          "@type": "FAQPage",
          "@id": "https://bondinvest.ru/faq/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Что такое индекс участия в BONDINVEST?",
              "acceptedAnswer": { "@type": "Answer", "text": "Это число от 0.0 до 1.3: базовые 0.1 плюс бонусы за три цели — лояльность (+0.3 или +0.5), объём (+0.2 или +0.4) и активность (+0.2 или +0.3). Чем выше индекс, тем больше доходность сверх гарантированных 4% годовых." }
            },
            {
              "@type": "Question",
              "name": "Зачем держать депозит 20 недель?",
              "acceptedAnswer": { "@type": "Answer", "text": "Потому что длинный горизонт даёт не только больший бонус (+0.5 вместо +0.3), но и время для эффекта сложного процента: реинвестированный доход приносит новый доход каждый год." }
            },
            {
              "@type": "Question",
              "name": "Как работает сложный процент с бонусом?",
              "acceptedAnswer": { "@type": "Answer", "text": "Бонус к индексу — не разовая надбавка. При реинвестировании доход начисляется на сумму вместе с прошлым доходом: 100 000 ₽ × 0,0375% = 37,5 ₽, на второй год база уже 100 037,5 ₽. Маленькая стабильная надбавка со временем усиливает итоговую доходность." }
            },
            {
              "@type": "Question",
              "name": "Какие гарантии у продукта?",
              "acceptedAnswer": { "@type": "Answer", "text": "База — государственные облигации (ОФЗ): купон капает ежедневно, номинал защищён, гарантированная ставка 4% годовых. Компания забирает фиксированную маржу 3%, ещё 1% идёт в резерв. Итого источник выплат — 11% доходности ОФЗ." }
            }
          ]
        }
      ]
    }
    </script>
