# =============================================================================
# BONDINVEST — конфиг математической модели участия (единая точка правки весов)
# =============================================================================
# Меняете значения здесь -> модель (model.py), API (/api/*) и фронтенд
# (app/src/generated/model-config.json) подхватывают новые веса автоматически.
#
# Формула:
#   Индекс = base + Б(стрейк/лояльность) + Б(объём) + Б(активность)
#   Ожидаемый бонус, ₽/год = индекс * rub_per_index_point
#
# Экономика (справочно, используется stress_tests):
#   Доходность ОФЗ ~ OFZ_YIELD (11%), пользователь получает 4-7% (цель 6-7%),
#   компания забирает маржу 3% (цель 3-4%), резерв 1%.
# =============================================================================

version: 1

# Базовая часть индекса — начисляется ВСЕМ без условий ("гарантированные 4%")
base_index: 0.1

# Курс перевода индекса в рубли: сколько ₽/год даёт 1.0 индекса при депозите 1000₽
rub_per_index_point: 75.0

# Порог "почти достигнута" для мягкого напоминания (доля цели)
almost_achieved_ratio: 0.9

goals:
  # --- Лояльность (стрейк): удержание депозита -------------------------------
  loyalty:
    title: "Лояльность"
    icon: "🏅"
    unit: "недель"
    thresholds:
      - { value: 8,  bonus: 0.3 }   # 8 недель подряд  -> +0.3 (~22.5₽/год)
      - { value: 20, bonus: 0.5 }   # 20 недель подряд -> +0.5 (~37.5₽/год)

  # --- Объём: средний размер депозита ----------------------------------------
  volume:
    title: "Объём"
    icon: "💰"
    unit: "₽"
    thresholds:
      - { value: 2000, bonus: 0.2 } # средний депозит 2000₽ -> +0.2 (~15₽/год)
      - { value: 5000, bonus: 0.4 } # средний депозит 5000₽ -> +0.4 (~30₽/год)

  # --- Активность: число пополнений в месяц ----------------------------------
  activity:
    title: "Активность"
    icon: "⚡"
    unit: "пополнений"
    thresholds:
      - { value: 3, bonus: 0.2 }    # 3 пополн./мес -> +0.2 (~15₽/год)
      - { value: 6, bonus: 0.3 }    # 6 пополн./мес -> +0.3 (~22.5₽/год)

# Справочные параметры экономики продукта (для стресс-тестов и маркетинга)
economics:
  ofz_yield_pct: 11.0        # доходность базы (ОФЗ)
  user_target_min_pct: 6.0   # целевая планка пользователя
  user_target_max_pct: 7.0
  company_margin_pct: 3.0    # целевая маржа компании (3-4%)
  reserve_pct: 1.0           # резерв
